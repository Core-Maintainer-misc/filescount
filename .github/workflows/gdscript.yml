name: GDScript Build and Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Godot
        uses: godotengine/godot-ci@v1
        with:
          godot-version: '4.x'

      - name: Run tests
        run: |
          godot --path . --headless --script tests/test.gd
